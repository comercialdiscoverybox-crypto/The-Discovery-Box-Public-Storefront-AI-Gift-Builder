services:
  - type: web
    name: the-discovery-box-storefront
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:storefront
    startCommand: npm run start:storefront
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        sync: false
