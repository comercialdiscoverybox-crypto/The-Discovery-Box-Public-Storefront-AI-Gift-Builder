services:
  - type: web
    name: the-discovery-box-storefront
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:storefront
    startCommand: npm run start:storefront
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
